const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function compressImage(file, maxWidth=800, quality=0.6) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const LESSON_FIELDS = [
  { key:'learned', label:'📚 習ったこと', color:'#2ea043', required:true, ph:'例：フォアハンドのグリップとスイング' },
  { key:'understood', label:'✅ 理解できたこと', color:'#1f6feb', required:false, ph:'例：ボールを引きつけて打つ感覚がつかめた' },
  { key:'challenge', label:'🎯 課題・できなかったこと', color:'#d4622a', required:false, ph:'例：フットワークのタイミングがまだ合わない' },
  { key:'notes', label:'📝 メモ・次回へ向けて', color:'#e3b341', required:false, ph:'例：次回はサーブの練習を追加する' },
];
const MATCH_FIELDS = [
  { key:'impression', label:'💬 感想・反省', color:'#1f6feb', ph:'試合全体を振り返って…' },
  { key:'good', label:'👍 良かったこと', color:'#2ea043', ph:'うまくできたプレーは？' },
  { key:'bad', label:'👎 悪かったこと', color:'#d4622a', ph:'改善したいプレーは？' },
  { key:'next', label:'🎯 次回への課題', color:'#e3b341', ph:'次の試合に向けて練習することは？' },
];
let _lessonPhotos={}, _matchPhotos=[], _matchResult='win', _authMode='login';
let _allLessons=[], _editingId=null, _editPhotos={};

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    document.getElementById('header-name').textContent=(user.displayName||user.email)+' さん';
    buildLessonForm(); buildMatchForm(); setTodayDates(); loadLessons(); loadMatches();
  } else {
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app-screen').style.display='none';
  }
});

window.switchAuthTab = (mode) => {
  _authMode=mode;
  document.getElementById('tab-login').className='tab-btn'+(mode==='login'?' active':'');
  document.getElementById('tab-signup').className='tab-btn'+(mode==='signup'?' active':'');
  document.getElementById('field-name').style.display=mode==='signup'?'block':'none';
  document.getElementById('pw-hint').style.display=mode==='signup'?'inline':'none';
  document.getElementById('auth-btn').textContent=mode==='login'?'ログイン':'アカウントを作成';
  document.getElementById('auth-error').style.display='none';
  document.getElementById('auth-success').style.display='none';
  document.getElementById('field-password').style.display='block';
  document.getElementById('reset-btn').style.display=mode==='login'?'block':'none';
};
window.showResetMode = () => {
  document.getElementById('auth-error').style.display='none';
  document.getElementById('auth-success').style.display='none';
  document.getElementById('field-password').style.display='none';
  document.getElementById('field-name').style.display='none';
  document.getElementById('auth-btn').textContent='リセットメールを送る';
  document.getElementById('reset-btn').textContent='← ログインに戻る';
  document.getElementById('reset-btn').onclick = () => {
    switchAuthTab('login');
    document.getElementById('reset-btn').textContent='パスワードをお忘れの方はこちら';
    document.getElementById('reset-btn').onclick = showResetMode;
  };
  _authMode='reset';
};
window.fillDemo = () => { switchAuthTab('login'); document.getElementById('input-email').value='coach@tennis.demo'; document.getElementById('input-password').value='demo1234'; };
window.handleAuth = async () => {
  const email=document.getElementById('input-email').value.trim();
  const pw=document.getElementById('input-password').value;
  const name=document.getElementById('input-name').value.trim();
  const errEl=document.getElementById('auth-error');
  const sucEl=document.getElementById('auth-success');
  errEl.style.display='none'; sucEl.style.display='none';
  try {
    if (_authMode==='reset') {
      await sendPasswordResetEmail(auth, email);
      sucEl.textContent='✅ パスワードリセットメールを送りました。';
      sucEl.style.display='block'; return;
    }
    if (_authMode==='signup') {
      if (!name){errEl.textContent='お名前を入力してください';errEl.style.display='block';return;}
      const cred=await createUserWithEmailAndPassword(auth,email,pw);
      await updateProfile(cred.user,{displayName:name});
    } else { await signInWithEmailAndPassword(auth,email,pw); }
  } catch(e) {
    const msgs={'auth/email-already-in-use':'このメールは既に登録されています','auth/invalid-email':'メールアドレスの形式が正しくありません','auth/weak-password':'パスワードは6文字以上にしてください','auth/invalid-credential':'メールまたはパスワードが違います'};
    errEl.textContent=msgs[e.code]||'エラー: '+e.message; errEl.style.display='block';
  }
};
window.logout = async () => { await signOut(auth); };
window.showTab = (tab) => {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
};
function setTodayDates() { const t=new Date().toISOString().split('T')[0]; document.getElementById('lesson-date').value=t; document.getElementById('match-date').value=t; }

// 検索
window.searchLessons = () => { renderLessons(_allLessons); };
window.clearSearch = () => { document.getElementById('search-input').value=''; renderLessons(_allLessons); };
function highlight(text, kw) {
  if (!kw||!text) return text||'';
  return text.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<span class="highlight">${m}</span>`);
}

// 編集モーダル
window.openEditModal = (id) => {
  const l = _allLessons.find(x=>x.id===id); if (!l) return;
  _editingId = id;
  _editPhotos = {};
  document.getElementById('edit-date').value = l.date;
  const c = document.getElementById('edit-fields'); c.innerHTML='';
  LESSON_FIELDS.forEach(f => {
    _editPhotos[f.key] = [...(l[f.key+'Media']||[])];
    c.innerHTML += `<div class="form-field-block" style="border-left:3px solid ${f.color}">
      <label style="color:${f.color};font-weight:bold;font-size:15px;margin-bottom:8px">${f.label}</label>
      <textarea id="edit-${f.key}" placeholder="${f.ph}">${l[f.key]||''}</textarea>
      <div class="media-grid" id="edit-preview-${f.key}"></div>
    </div>`;
  });
  LESSON_FIELDS.forEach(f => renderEditPreview(f.key));
  document.getElementById('edit-modal').style.display='block';
};
window.closeEditModal = (e) => { if(e.target===e.currentTarget) document.getElementById('edit-modal').style.display='none'; };
function renderEditPreview(key) {
  const grid=document.getElementById('edit-preview-'+key); if(!grid) return;
  grid.innerHTML='';
  (_editPhotos[key]||[]).forEach((m,i)=>{
    const wrap=document.createElement('div'); wrap.className='media-wrap';
    wrap.innerHTML=`<img src="${m.data}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px" />`;
    const btn=document.createElement('button'); btn.className='remove-btn'; btn.textContent='✕';
    btn.onclick=()=>{_editPhotos[key].splice(i,1);renderEditPreview(key);};
    wrap.appendChild(btn); grid.appendChild(wrap);
  });
}
window.saveEdit = async () => {
  const errEl=document.getElementById('edit-form-error'); errEl.style.display='none';
  const learned=document.getElementById('edit-learned').value.trim();
  if (!learned){errEl.textContent='「習ったこと」を入力してください';errEl.style.display='block';return;}
  const data={date:document.getElementById('edit-date').value};
  LESSON_FIELDS.forEach(f=>{data[f.key]=document.getElementById('edit-'+f.key).value.trim();data[f.key+'Media']=_editPhotos[f.key]||[];});
  await updateDoc(doc(db,'lessons',_editingId),data);
  document.getElementById('edit-modal').style.display='none';
  loadLessons();
};

function buildLessonForm() {
  _lessonPhotos={};
  const c=document.getElementById('lesson-fields'); c.innerHTML='';
  LESSON_FIELDS.forEach(f => {
    _lessonPhotos[f.key]=[];
    const d=document.createElement('div'); d.className='form-field-block'; d.style.borderLeft='3px solid '+f.color;
    d.innerHTML=`<label style="color:${f.color};font-weight:bold;font-size:15px;margin-bottom:8px">${f.label}${f.required?' <span style="color:#d4622a">*</span>':''}</label><textarea id="lesson-${f.key}" placeholder="${f.ph}"></textarea><div class="upload-box" onclick="document.getElementById('file-${f.key}').click()">📎 写真を添付（自動圧縮）<input type="file" id="file-${f.key}" accept="image/*" multiple style="display:none" /></div><div class="compress-info">※ 写真は自動的に圧縮されます</div><div class="media-grid" id="preview-${f.key}"></div>`;
    c.appendChild(d);
    document.getElementById('file-'+f.key).addEventListener('change',(e)=>handleLessonFile(e,f.key));
  });
}
async function handleLessonFile(e,key) {
  for (const file of Array.from(e.target.files)) {
    const compressed = await compressImage(file);
    _lessonPhotos[key].push({type:'image',data:compressed});
    renderLessonPreview(key);
  }
}
function renderLessonPreview(key) {
  const grid=document.getElementById('preview-'+key); grid.innerHTML='';
  _lessonPhotos[key].forEach((m,i)=>{
    const wrap=document.createElement('div'); wrap.className='media-wrap';
    wrap.innerHTML=`<img src="${m.data}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px" />`;
    const btn=document.createElement('button'); btn.className='remove-btn'; btn.textContent='✕';
    btn.onclick=()=>{_lessonPhotos[key].splice(i,1);renderLessonPreview(key);};
    wrap.appendChild(btn); grid.appendChild(wrap);
  });
}
window.saveLesson = async () => {
  const errEl=document.getElementById('lesson-form-error'); errEl.style.display='none';
  const learned=document.getElementById('lesson-learned').value.trim();
  if (!learned){errEl.textContent='「習ったこと」を入力してください';errEl.style.display='block';return;}
  const user=auth.currentUser;
  const data={uid:user.uid,date:document.getElementById('lesson-date').value,createdAt:Date.now()};
  LESSON_FIELDS.forEach(f=>{data[f.key]=document.getElementById('lesson-'+f.key).value.trim();data[f.key+'Media']=_lessonPhotos[f.key]||[];});
  await addDoc(collection(db,'lessons'),data);
  buildLessonForm(); setTodayDates(); showTab('lessons');
  const s=document.getElementById('lesson-success'); s.style.display='block'; setTimeout(()=>s.style.display='none',3000);
  loadLessons();
};
async function loadLessons() {
  const uid=auth.currentUser?.uid; if (!uid) return;
  const el=document.getElementById('lessons-list'); el.innerHTML='<div class="loading">読み込み中…</div>';
  const q=query(collection(db,'lessons'),where('uid','==',uid),orderBy('date','desc'));
  const snap=await getDocs(q); _allLessons=[];
  snap.forEach(d=>_allLessons.push({id:d.id,...d.data()}));
  renderLessons(_allLessons);
}
function renderLessons(docs) {
  const kw = document.getElementById('search-input')?.value.trim()||'';
  const filtered = kw ? docs.filter(l=>LESSON_FIELDS.some(f=>(l[f.key]||'').includes(kw))||l.date.includes(kw)) : docs;
  const el=document.getElementById('lessons-list'); el.innerHTML='';
  if (!filtered.length){
    el.innerHTML=`<div class="empty-state"><div style="font-size:48px;margin-bottom:12px">${kw?'🔍':'📓'}</div>${kw?`「${kw}」の記録が見つかりません`:'まだ記録がありません'}<br><span style="font-size:14px">${kw?'':'「記録」から追加しましょう'}</span></div>`;
    return;
  }
  filtered.forEach(l=>{
    const div=document.createElement('div'); div.className='lesson-item';
    let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:13px;color:#e3b341">📅 ${l.date}</div>
      <div>
        <button class="btn-edit" onclick="openEditModal('${l.id}')" title="編集">✏️</button>
        <button class="btn-delete" onclick="deleteLesson('${l.id}')">🗑</button>
      </div></div>`;
    LESSON_FIELDS.forEach(f=>{
      const text=l[f.key]; const media=l[f.key+'Media']||[];
      if (!text&&!media.length) return;
      html+=`<div class="field-block" style="border-left:3px solid ${f.color}"><div class="field-label">${f.label}</div>${text?`<div class="field-text">${highlight(text,kw)}</div>`:''}${media.length?`<div class="media-grid">${media.map(m=>`<img src="${m.data}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">`).join('')}</div>`:''}</div>`;
    });
    div.innerHTML=html; el.appendChild(div);
  });
}
window.deleteLesson = async (id) => { await deleteDoc(doc(db,'lessons',id)); loadLessons(); };
function buildMatchForm() {
  _matchPhotos=[]; _matchResult='win';
  const c=document.getElementById('match-fields'); c.innerHTML='';
  MATCH_FIELDS.forEach(f=>{
    const d=document.createElement('div'); d.className='form-field-block'; d.style.borderLeft='3px solid '+f.color;
    d.innerHTML=`<label style="color:${f.color};font-weight:bold;font-size:15px;margin-bottom:8px">${f.label}</label><textarea id="match-${f.key}" placeholder="${f.ph}"></textarea>`;
    c.appendChild(d);
  });
}
window.setResult = (r) => {
  _matchResult=r;
  document.getElementById('result-win').className='result-btn'+(r==='win'?' active-win':'');
  document.getElementById('result-lose').className='result-btn'+(r==='lose'?' active-lose':'');
};
window.handleMatchFiles = async (e) => {
  for (const file of Array.from(e.target.files)) {
    const compressed = await compressImage(file);
    _matchPhotos.push({type:'image',data:compressed});
    renderMatchPreview();
  }
};
function renderMatchPreview() {
  const grid=document.getElementById('match-photo-preview'); grid.innerHTML='';
  _matchPhotos.forEach((m,i)=>{
    const wrap=document.createElement('div'); wrap.className='media-wrap';
    wrap.innerHTML=`<img src="${m.data}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px" />`;
    const btn=document.createElement('button'); btn.className='remove-btn'; btn.textContent='✕';
    btn.onclick=()=>{_matchPhotos.splice(i,1);renderMatchPreview();};
    wrap.appendChild(btn); grid.appendChild(wrap);
  });
}
window.switchMatchTab = (tab) => {
  document.getElementById('subnav-list').className='sub-nav-btn'+(tab==='list'?' active':'');
  document.getElementById('subnav-add').className='sub-nav-btn'+(tab==='add'?' active':'');
  document.getElementById('match-list-view').style.display=tab==='list'?'block':'none';
  document.getElementById('match-add-view').style.display=tab==='add'?'block':'none';
};
window.saveMatch = async () => {
  const errEl=document.getElementById('match-form-error'); errEl.style.display='none';
  const opponent=document.getElementById('match-opponent').value.trim();
  if (!opponent){errEl.textContent='対戦相手を入力してください';errEl.style.display='block';return;}
  const user=auth.currentUser;
  const data={uid:user.uid,date:document.getElementById('match-date').value,opponent,score:document.getElementById('match-score').value.trim(),result:_matchResult,photos:_matchPhotos,createdAt:Date.now()};
  MATCH_FIELDS.forEach(f=>{data[f.key]=document.getElementById('match-'+f.key).value.trim();});
  await addDoc(collection(db,'matches'),data);
  buildMatchForm(); setTodayDates(); switchMatchTab('list');
  const s=document.getElementById('match-success'); s.style.display='block'; setTimeout(()=>s.style.display='none',3000);
  loadMatches();
};
async function loadMatches() {
  const uid=auth.currentUser?.uid; if (!uid) return;
  const q=query(collection(db,'matches'),where('uid','==',uid),orderBy('date','desc'));
  const snap=await getDocs(q); const docs=[]; snap.forEach(d=>docs.push({id:d.id,...d.data()}));
  const wins=docs.filter(m=>m.result==='win').length;
  document.getElementById('match-stats').innerHTML=[
    {label:'試合数',val:docs.length,color:'#e3b341'},
    {label:'勝ち',val:wins,color:'#2ea043'},
    {label:'負け',val:docs.length-wins,color:'#d4622a'},
  ].map(s=>`<div class="stat-box"><div class="stat-num" style="color:${s.color}">${s.val}</div><div class="stat-label">${s.label}</div></div>`).join('');
  const el=document.getElementById('matches-list'); el.innerHTML='';
  if (!docs.length){el.innerHTML='<div class="empty-state"><div style="font-size:48px;margin-bottom:12px">🎾</div>まだ試合記録がありません</div>';return;}
  docs.forEach(m=>{
    const div=document.createElement('div'); div.className='match-item'; div.style.borderLeft=`4px solid ${m.result==='win'?'#2ea043':'#d4622a'}`;
    let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><span style="font-size:13px;color:#e3b341">${m.date}　</span><span style="font-size:18px;font-weight:bold">vs ${m.opponent}</span></div><div style="display:flex;align-items:center;gap:8px"><span class="result-badge ${m.result==='win'?'result-win':'result-lose'}">${m.result==='win'?'✨ 勝ち':'😤 負け'}</span><button class="btn-delete" onclick="deleteMatch('${m.id}')">🗑</button></div></div>`;
    if (m.score) html+=`<div class="match-score">${m.score}</div>`;
    MATCH_FIELDS.forEach(f=>{if(m[f.key])html+=`<div class="field-block" style="border-left:3px solid ${f.color}"><div class="field-label">${f.label}</div><div class="field-text">${m[f.key]}</div></div>`;});
    if (m.photos?.length) html+=`<div class="media-grid">${m.photos.map(p=>`<img src="${p.data}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">`).join('')}</div>`;
    div.innerHTML=html; el.appendChild(div);
  });
}
window.deleteMatch = async (id) => { await deleteDoc(doc(db,'matches',id)); loadMatches(); };
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
}
</script>
</body>
